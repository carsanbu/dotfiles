- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.config/tmux/: ../unix/tmux/
    ~/.config/:
      glob: true
      path: ../.config/*
    ~/.aliases.sh: ../unix/scripts/aliases.sh
    ~/:
      glob: true
      path: ../zsh/*
      prefix: '.'
    ~/.local/bin:
      glob: true
      path: ../.local/bin/*
    ~/.local/share:
      glob: true
      path: ../.local/share/*

